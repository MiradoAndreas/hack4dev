[project]
name = "building-age-classification"
version = "0.1.0"
description = "Spatial transfer learning for building-age classification from spectral time series."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastparquet>=2026.9.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
deep-learning = [
    "torch==2.15.0",
]
